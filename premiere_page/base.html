<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication d'images</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        .image {
            position: absolute;
            width: 150px;
            height: 150px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <script>
        const imageUrl = 'image.jpg'; // Assurez-vous que le fichier est bien dans le même répertoire

        function spawnImage(x, y, rotation = Math.random() * 360, scale = Math.random() * 2, opacity = Math.random() * 0.7 + 0.3) {
            let img = document.createElement('img');
            img.src = imageUrl;
            img.classList.add('image');
            img.style.left = x + 'px';
            img.style.top = y + 'px';
            img.style.transform = `rotate(${rotation}deg) scale(${scale})`;
            img.style.opacity = opacity;
            document.body.appendChild(img);
        }

        document.addEventListener('click', function(event) {
            spawnImage(event.clientX, event.clientY);
        });

        setInterval(() => {
            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;
            spawnImage(x, y);
        }, 50);

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                document.querySelectorAll('.image').forEach(img => img.remove());
            }
        });
    </script>
</body>
</html>
