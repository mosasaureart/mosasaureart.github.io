        <div class="clickable" style="top: -10%; left: 15%; width: 30%; height: 30%;" onclick="showText('Le trouble est généralement déclenché par un stress intense, en particulier dû à des actes de maltraitance affective ou de négligence pendant l’enfance ou d’autres stress importants (par exemple subir ou être témoin de maltraitance physique). Un sentiment de détachement par rapport à soi-même ou son environnement peut être éprouvé de façon périodique ou continue. Le médecin diagnostique le trouble en se fondant sur les symptômes, après avoir réalisé des tests visant à exclure d’autres causes possibles. La psychothérapie, en particulier la thérapie comportementale et cognitive, est souvent utile.Les impressions temporaires de dépersonnalisation et/ou de déréalisation sont fréquentes. Près de la moitié de la population s’est déjà sentie détachée d’elle-même (dépersonnalisation) ou de son environnement (déréalisation) à un moment donné. Ce sentiment survient souvent lorsqu’une personne, à connu un danger menaçant sa vie, est très fatiguée, est privée de sommeil ou de stimulation sensorielle (comme cela peut se produire en unité de soins intensifs). La dépersonnalisation ou la déréalisation peuvent aussi être les symptômes de nombreux autres troubles de santé mentale, ainsi que de troubles médicaux généraux, tels que les troubles convulsifs. Les sensations de dépersonnalisation/déréalisation sont considérées comme un trouble lorsque : La dépersonnalisation ou la déréalisation surviennent spontanément (c’est-à-dire qu’elles ne sont pas provoquées par des médicaments ou un autre trouble de santé mentale), et elles persistent ou se reproduisent. Les symptômes sont particulièrement pénibles pour la personne atteinte ou rendent son fonctionnement quotidien ou professionnel difficile. Le trouble de dépersonnalisation/déréalisation affecte environ 2 % de la population et touche autant les hommes que les femmes. Le trouble peut apparaître au cours de la petite enfance ou de l’enfance. Il commence rarement après 40 ans.')"></div>

        <div class="clickable" style="top: 10%; left: -8%; width: 33%; height: 45%;" onclick="showText('Les symptômes du trouble de dépersonnalisation/déréalisation peuvent commencer progressivement ou soudainement. Les épisodes peuvent durer seulement quelques heures ou quelques jours ou pendant des semaines, des mois ou des années. Les épisodes peuvent se caractériser par de la dépersonnalisation, de la déréalisation, ou les deux. L’intensité des symptômes est généralement variable. Mais lorsque le trouble est grave, les symptômes peuvent être présents et garder la même intensité pendant des années voire des décennies. Les symptômes de dépersonnalisation impliquent. Se sentir détaché de son propre corps, de son esprit, de ses sentiments et/ou de ses sensations. Les personnes disent parfois qu’elles se sentent irréelles ou comme un automate, sans aucun contrôle sur ce qu’elles font ou disent. Elles peuvent se sentir engourdies émotionnellement et physiquement. De telles personnes se décrivent parfois comme étant un observateur extérieur de leur propre vie ou un « zombie ». Les symptômes de déréalisation impliquent. Un sentiment de détachement de l’environnement (des personnes, objets ou tout ce qui entoure la personne), qui semble irréel. La personne peut avoir l’impression d’être dans un rêve ou dans un brouillard, ou comme s’il y avait un mur de verre ou un voile qui la séparait de son environnement. Le monde semble sans vie, dépourvu de couleur, ou artificiel. Le monde peut apparaître déformé aux yeux d’une personne atteinte. Par exemple, les objets peuvent apparaître flous ou inhabituellement nets, ou ils peuvent sembler sans relief ou plus petits ou plus grands que ce qu’ils sont. Les sons peuvent sembler plus forts ou moins forts qu’ils le sont. Le temps paraît passer trop lentement ou trop vite. Les symptômes induisent presque toujours une forte gêne. Certaines personnes les trouvent intolérables. Dépression et anxiété sont fréquentes. De nombreuses personnes atteintes craignent que les symptômes soient dus à des lésions cérébrales irréversibles..')"></div>
